# Mora Audio Suite - made by Mora & Claude Code
# Builds the Mora Audio app on every push / pull request / manual run.
# Download the APK from the run page -> "Artifacts". Push a tag like v2.0 to also publish a GitHub Release.
name: Build APK
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MoraAudio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MoraAudio-apk
          path: MoraAudio.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MoraAudio.apk
