// Mora Audio Suite - made by Mora & Claude Code
plugins { id 'com.android.application' }

def releaseStorePath = System.getenv('MORA_KEYSTORE_PATH')
def ciVersionCode = System.getenv('MORA_VERSION_CODE')

android {
    namespace 'app.mora.audio'
    compileSdk 34
    defaultConfig {
        applicationId 'app.mora.audio'
        minSdk 26
        targetSdk 34
        // CI supplies a monotonically increasing GitHub Actions run number.
        versionCode ciVersionCode ? ciVersionCode.toInteger() : 4
        versionName '2.2.0'
    }
    signingConfigs {
        release {
            if (releaseStorePath) {
                storeFile file(releaseStorePath)
                storePassword System.getenv('MORA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MORA_KEY_ALIAS')
                keyPassword System.getenv('MORA_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseStorePath) { signingConfig signingConfigs.release }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
}

// Runtime has no third-party dependencies; JUnit is used only for local parser tests.
