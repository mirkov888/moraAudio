// Mora Audio Suite - made by Mora & Claude Code
plugins { id 'com.android.application' }

android {
    namespace 'app.mora.audio'
    compileSdk 34
    defaultConfig {
        applicationId 'app.mora.audio'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// no dependencies on purpose: the app only uses the platform widgets and talks to the module through root
