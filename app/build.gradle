// Mora Audio Suite - made by Mora & Claude Code
plugins { id 'com.android.application' }

android {
    namespace 'app.mora.audio'
    compileSdk 34
    defaultConfig {
        applicationId 'app.mora.audio'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '2.1.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}

// Runtime has no third-party dependencies; JUnit is used only for local parser tests.
